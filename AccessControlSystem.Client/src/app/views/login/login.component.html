<div class="login-container">
  <div class="login-card">
    <h3 class="mb-4">{{ 'auth.welcome_back' | translate }}</h3>
    <img src="/assets/images/logo.png" class="mb-3" />

    <p>{{ 'auth.please_login' | translate }}</p>

    <form (submit)="onSubmit()">
      <div class="form-group">
        <label for="email">{{ 'auth.email' | translate }}</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" required />
      </div>

      <div class="form-group">
        <label for="password">{{ 'auth.password' | translate }}</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" required />
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
          {{ 'auth.remember_me' | translate }}
        </label>
        <a class="forgot" href="#">{{ 'auth.forgot_password' | translate }}</a>
      </div>

      <button type="submit" class="login-btn">{{ 'auth.login' | translate }}</button>
    </form>
  </div>
</div>
