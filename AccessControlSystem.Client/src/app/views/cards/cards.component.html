<div class="breadcrumb mb-5">
  <div class="page-title">
    <img src="/assets/icons/back-arrow.svg" alt="Back Button" />
    <h4>{{ 'cards.title' | translate }}</h4>
  </div>
  <span>{{ 'cards.review_details' | translate }}</span>
</div>
<div class="page-header">

  <dx-button class="button-info me-1" [text]="'cards.add_new' | translate" (onClick)="showAddCardsPopup()">
  </dx-button>
</div>


<div class="card-container">
  <div class="user-card" *ngFor="let user of cardsList">
    <img class="avatar" src="/assets/images/avatar.jpg" alt="User Avatar">
    <div class="user-info">
      <h3>{{ user.name }}</h3>
      <p class="status" [ngClass]="user.active ? 'active' : 'inactive'">
        {{ user.active ? ('cards.active' | translate) : ('cards.not_active' | translate) }}
      </p>
    </div>
  </div>
</div>


<div *ngIf="cardsList && cardsList.length === 0" class="no-data">
  {{ 'cards.no_cards_available' | translate }}
</div>
